<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillMaker Pro - Neorphic Admin Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .glass-neomorphic {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.9) 0%, rgba(11, 15, 25, 0.95) 100%);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 12px 12px 25px rgba(0, 0, 0, 0.7);
        }
        .neo-input {
            background: #0d1322;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.6), inset -2px -2px 5px rgba(255, 255, 255, 0.04);
            color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- LOGIN CONTAINER -->
    <div id="loginCard" class="glass-neomorphic rounded-3xl max-w-md w-full p-8 space-y-6 border border-purple-500/40 shadow-2xl">
        <div class="text-center space-y-2">
            <div class="bg-purple-600/20 text-purple-400 p-4 rounded-full w-16 h-16 mx-auto flex items-center justify-center text-2xl border border-purple-500/30 shadow-lg">
                <i class="fa-solid fa-user-shield animate-pulse"></i>
            </div>
            <h1 class="text-xl font-bold text-white tracking-wide font-tech">Neorphic Admin Control</h1>
            <p class="text-xs text-slate-400">BillMaker Pro Studio Enterprise Suite</p>
        </div>

        <div class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">Master Password (Default: admin123):</label>
                <input type="password" id="adminPassInput" class="w-full p-3 neo-input rounded-2xl text-sm outline-none" placeholder="••••••••">
            </div>
            <button onclick="verifyPassword()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 text-white font-semibold py-3 rounded-2xl shadow-xl transition">
                Authenticate & Access
            </button>
            <div class="text-center pt-2">
                <a href="index.html" class="text-slate-400 hover:text-white underline"><i class="fa-solid fa-arrow-left mr-1"></i> Return to Studio</a>
            </div>
        </div>
    </div>

    <!-- DASHBOARD CONTAINER -->
    <div id="dashboardCard" class="glass-neomorphic rounded-3xl max-w-2xl w-full p-8 space-y-6 border border-purple-500/40 shadow-2xl hidden max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-lg font-bold text-white flex items-center gap-2 font-tech"><i class="fa-solid fa-sliders text-purple-400"></i> Neorphic Admin Center</h1>
                <p class="text-xs text-slate-400">Manage user feature permissions & advertising banners</p>
            </div>
            <div class="flex items-center gap-2">
                <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl border border-slate-700">Studio</a>
                <button onclick="logout()" class="text-xs bg-red-950/50 hover:bg-red-900/70 text-red-300 px-3 py-1.5 rounded-xl border border-red-800/60">Logout</button>
            </div>
        </div>

        <div class="space-y-4 text-xs">
            <div class="bg-[#0d1322] p-4 rounded-2xl border border-slate-800 space-y-3">
                <h3 class="font-bold text-purple-400 uppercase text-[11px] tracking-wider"><i class="fa-solid fa-rectangle-ad mr-1"></i> Banners & Advertising</h3>
                <div>
                    <label class="block text-slate-400 mb-1">Top Banner Text:</label>
                    <input type="text" id="adminBannerText" class="w-full p-2.5 neo-input rounded-xl">
                </div>
            </div>
            <button onclick="saveAdminSettings()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold py-3 rounded-2xl shadow-xl transition">
                Save & Deploy Master Controls
            </button>
        </div>
    </div>

    <script>
        function verifyPassword() {
            const input = document.getElementById('adminPassInput').value;
            const saved = localStorage.getItem('billmaker_admin_pass') || 'admin123';
            if (input === saved) {
                document.getElementById('loginCard').classList.add('hidden');
                document.getElementById('dashboardCard').classList.remove('hidden');
            } else {
                alert("Incorrect Password!");
            }
        }
        function saveAdminSettings() {
            localStorage.setItem('billmaker_banner_text', document.getElementById('adminBannerText').value);
            alert("Settings applied!");
        }
        function logout() { location.reload(); }
    </script>
</body>
</html>
